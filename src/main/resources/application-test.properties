spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS FINANCEIRO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway desabilitado nos testes — schema criado via ddl-auto no H2
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# Redis de teste — nenhuma conexão é estabelecida durante os testes
spring.data.redis.url=redis://localhost:6379

# JWT / refresh token
spring.app.jwtSecretKey=test-secret-key-for-hs512-with-at-least-64-bytes-0123456789-abcdef
spring.app.jwtExpiration=60
spring.app.jwtRefreshExpirationMs=604800000
spring.app.refreshRotatedGraceMs=30000
app.cookie.secure=false

# CORS
app.cors.allowed-origins=http://localhost:3000
