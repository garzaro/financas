spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS FINANCEIRO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#spring.datasource.driverClassName=org.h2.Driver

# Configurações JWT para testes
spring.app.jwtSecretKey=testSecretKeyForJwtAuthenticationMustBeLongEnoughForHMACSHA256
spring.app.jwtExpirationMs=900000
spring.app.jwtRefreshExpirationMs=604800000
app.cookie.secure=false