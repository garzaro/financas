# propriedade para lidar com proxy
#server.forward-headers-strategy=native
# Carrega arquivo .env (com override de variaveis de ambiente do sistema)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL_NEON}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#validate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Desabilita validacao automatica do Hibernate no ciclo de vida JPA (pre-persist/update).
# A validacao responsabilidade da camada de controller (@Valid) e de servico.
#spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.messages.basename=messages
spring.messages.encoding=UTF-8

#JWT
spring.app.jwtSecretKey=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION}
spring.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION}
spring.app.refreshRotatedGraceMs=${JWT_REFRESH_REFRESHROTATEDGRACEMS}

#Suppress o warning de injecao de dependencias
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

#Migration
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS}
spring.flyway.table=${FLYWAY_HISTORICO}
spring.flyway.schemas=${SCHEMA}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#DOCUMENTACAO
# Altera o caminho da interface visual do Swagger (Padrao: /swagger-ui/index.html) /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui/index.html
# Altera o caminho onde o JSON bruto da especificacao e gerado (Padrao: /v3/api-docs) /api-docs
springdoc.api-docs.path=/v3/api-docs

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

