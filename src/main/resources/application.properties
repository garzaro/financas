#spring.application.name=financas
#spring.datasource.url=jdbc:postgresql://${IP_ADDRESS}:5432/DB
server.port=8081
server.forward-headers-strategy=native

#spring.datasource.url=jdbc:postgresql://localhost:5432/financa 
spring.datasource.url={SPRING_DATASOURCE_URL}
spring.datasource.username={SPRING_DATASOURCE_USERNAME}
spring.datasource.password={SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.messages.basename=messages


# Configurações recomendadas para Serverless
# Como o Neon pode entrar em "sleep", um timeout maior ajuda na primeira conexão
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000


#Migration
spring.flyway.enabled=true
spring.flyway.url={FLYWAY_URL}
spring.flyway.user={FLYWAY_USER}
spring.flyway.password={FLYWAY_PASSWORD}
spring.flyway.locations={FLYWAY_LOCATIONS}
spring.flyway.table=historico
spring.flyway.schemas=financeiro
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#DOCUMENTAÇÃO
# Altera o caminho da interface visual do Swagger (PadrÃ£o: /swagger-ui/index.html) /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui/index.html
# Altera o caminho onde o JSON bruto da especificação é gerado (Padrão: /v3/api-docs) /api-docs
springdoc.api-docs.path=/v3/api-docs


