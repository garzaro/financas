#spring.application.name=financas
#spring.datasource.url=jdbc:postgresql://[IP_ADDRESS]/db
#server.port=0

# propriedade para lidar com proxy
server.forward-headers-strategy=native
# Carrega arquivo .env (com override de variáveis de ambiente do sistema)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/financa
spring.datasource.username=postgres
spring.datasource.password=postgres

#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Desabilita validação automática do Hibernate no ciclo de vida JPA (pre-persist/update).
# A validação é responsabilidade da camada de controller (@Valid) e de serviço.
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.messages.basename=messages

#JWT
spring.app.jwtSecretKey=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION}

#Suppress o warning de injecao de dependencias
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Configurações recomendadas para Serverless
# Como o Neon pode entrar em "sleep", um timeout maior ajuda na primeira conexão
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000


#Migration
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS}
spring.flyway.table=historico
spring.flyway.schemas=financeiro
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#DOCUMENTAÇÃO
# Altera o caminho da interface visual do Swagger (Padrão: /swagger-ui/index.html) /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui/index.html
# Altera o caminho onde o JSON bruto da especificação é gerado (Padrão: /v3/api-docs) /api-docs
springdoc.api-docs.path=/v3/api-docs

# Configurações JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}

